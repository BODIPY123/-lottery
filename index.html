<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 幸运刮刮乐 & 体彩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gold: #ffd700; --gold-deep: #f0a500; --pink: #e0245e; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(circle at 20% 10%, #7b2ff7, transparent 40%),
                radial-gradient(circle at 80% 80%, #2575fc, transparent 45%),
                linear-gradient(135deg, #3a0ca3, #240046);
    font-family: "Microsoft YaHei", sans-serif; color: #fff; padding: 20px 16px 60px; overflow-x: hidden;
  }
  h1 {
    margin: 6px 0 2px; font-size: 32px; letter-spacing: 2px;
    background: linear-gradient(90deg, #ffe259, #ffa751, #ffe259);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 6px rgba(255,180,0,0.5));
    animation: shine 3s linear infinite; background-size: 200% auto;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .tip { margin-bottom: 12px; opacity: 0.85; font-size: 12.5px; text-align: center; line-height: 1.6; }

  .pool {
    width: 100%; max-width: 560px; margin-bottom: 14px; padding: 12px 18px;
    background: linear-gradient(135deg, rgba(255,215,0,0.22), rgba(255,140,0,0.18));
    border: 1px solid rgba(255,215,0,0.5); border-radius: 16px; text-align: center;
    box-shadow: 0 0 20px rgba(255,200,0,0.25);
  }
  .pool .k { font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  .pool .v { font-size: 30px; font-weight: bold; color: #fff; text-shadow: 0 0 12px rgba(255,215,0,0.7); }
  .pool .note { font-size: 11px; opacity: 0.8; margin-top: 2px; }
  .pool .best { font-size: 12px; color: var(--gold); margin-top: 4px; font-weight: bold; }

  .marquee {
    width: 100%; max-width: 560px; overflow: hidden; white-space: nowrap;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,215,0,0.3);
    border-radius: 20px; padding: 6px 0; margin-bottom: 16px; font-size: 13px; color: var(--gold);
  }
  .marquee span { display: inline-block; padding-left: 100%; animation: scroll 18s linear infinite; }
  @keyframes scroll { to { transform: translateX(-100%); } }

  .stats { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 8px 16px; text-align: center; min-width: 92px; backdrop-filter: blur(6px);
  }
  .stat .k { font-size: 11px; opacity: 0.75; }
  .stat .v { font-size: 20px; font-weight: bold; }
  .stat .v.money { color: var(--gold); }
  .stat .v.up { animation: pop 0.4s; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.35); color:#7CFC00;} 100%{transform:scale(1);} }
  .stat .v.down { animation: dpop 0.4s; }
  @keyframes dpop { 0%{transform:scale(1);} 40%{transform:scale(1.2); color:#ff6b6b;} 100%{transform:scale(1);} }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    padding: 10px 26px; border-radius: 24px; cursor: pointer; font-weight: bold; font-size: 15px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s;
  }
  .tab.active { background: linear-gradient(135deg,#ffe259,#ffa751); color:#4a2500; border-color: transparent; }
  .view { display: none; flex-direction: column; align-items: center; width: 100%; }
  .view.active { display: flex; }

  .shop { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .card-btn {
    position: relative; padding: 14px 18px; border: 2px solid transparent; border-radius: 16px;
    color: #fff; cursor: pointer; text-align: center; line-height: 1.5; min-width: 140px;
    transition: transform 0.15s, box-shadow 0.2s; overflow: hidden;
  }
  .card-btn::before {
    content: ''; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: skewX(-20deg); transition: left 0.5s;
  }
  .card-btn:hover:not(:disabled)::before { left: 120%; }
  .card-btn.low  { background: linear-gradient(135deg,#cd7f32,#a0522d); }
  .card-btn.mid  { background: linear-gradient(135deg,#c0c0c0,#8e9eab); }
  .card-btn.high { background: linear-gradient(135deg,#ffd700,#ff8c00); color:#4a2500; }
  .card-btn:hover:not(:disabled) { transform: translateY(-4px) scale(1.03); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
  .card-btn.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }
  .card-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .card-btn .name { font-size: 17px; font-weight: bold; }
  .card-btn .cost { font-size: 13px; font-weight: bold; }
  .card-btn .desc { font-size: 11px; opacity: 0.9; }
  .card-btn .top { font-size: 10px; margin-top: 3px; opacity: 0.85; }

  .card-wrap {
    position: relative; border-radius: 18px; padding: 6px;
    background: linear-gradient(135deg, #ffe259, #ffa751);
    box-shadow: 0 14px 40px rgba(0,0,0,0.45); min-height: 130px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-inner { background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .grid { display: grid; grid-template-columns: repeat(3, 108px); gap: 8px; padding: 14px; }
  .zone {
    position: relative; height: 76px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #fff, #ffeef4);
    border-radius: 8px; box-shadow: inset 0 0 0 1px #f3c9d6; overflow: hidden;
  }
  .zone .val { font-weight: bold; color: var(--pink); font-size: 19px; z-index:1; transition: transform 0.3s; }
  .zone.win .val { animation: winpop 0.5s; }
  @keyframes winpop { 0%{transform:scale(0.3); opacity:0;} 60%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .zone.jackpot { background: radial-gradient(circle at 50% 40%, #fff8dc, #ffd700); animation: jpglow 0.8s infinite alternate; }
  .zone.jackpot .val { color: #b8860b; font-size: 15px; }
  @keyframes jpglow { from{box-shadow:inset 0 0 0 2px #ffd700, 0 0 6px #ffd700;} to{box-shadow:inset 0 0 0 2px #fff, 0 0 18px #ffcc00;} }
  .zone canvas { position: absolute; inset: 0; width: 108px; height: 76px; touch-action: none; cursor: none; border-radius: 8px; z-index: 2; }

  .placeholder { color: #b06; font-size: 15px; text-align: center; padding: 34px 20px; font-weight:bold; }

  .lotto-box {
    width: 100%; max-width: 480px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 18px; padding: 20px; text-align: center;
  }
  .lotto-box h3 { font-size: 17px; margin-bottom: 6px; }
  .lotto-box .sub { font-size: 12px; opacity: 0.8; margin-bottom: 14px; line-height: 1.6; }
  .ball-pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .ball {
    width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: bold; cursor: pointer; user-select: none;
    background: radial-gradient(circle at 35% 30%, #fff, #b0b7c3); color: #333;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: transform 0.12s;
  }
  .ball:hover { transform: scale(1.1); }
  .ball.sel { background: radial-gradient(circle at 35% 30%, #ffe680, #ff9d00); color: #4a2500; box-shadow: 0 0 12px #ffb300; transform: scale(1.08); }
  .ball.hit { background: radial-gradient(circle at 35% 30%, #a6ff7c, #2ecc40); color:#083; animation: winpop 0.5s; }

  .bet-count { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; align-items: center; }
  .bet-count .lbl { font-size: 12px; opacity: 0.8; margin-right: 4px; }
  .bet-count .bc {
    padding: 6px 16px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: bold;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  }
  .bet-count .bc.active { background: linear-gradient(135deg,#ffe259,#ffa751); color:#4a2500; border-color: transparent; }

  .lotto-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .draw-result { margin-top: 14px; min-height: 48px; display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: center; max-height: 300px; overflow-y: auto; }
  .note-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .note-lbl { font-size: 12px; opacity: 0.75; width: 42px; text-align: right; }
  .note-tag { font-size: 12px; font-weight: bold; margin-left: 4px; min-width: 52px; text-align: left; }
  .draw-ball {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; background: radial-gradient(circle at 35% 30%, #fff, #ff8c00); color:#4a2500;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35); animation: winpop 0.4s;
  }
  .draw-ball.matched { background: radial-gradient(circle at 35% 30%, #a6ff7c, #2ecc40); box-shadow: 0 0 14px #2ecc40; }

  #scratcher {
    position: fixed; pointer-events: none; font-size: 30px; z-index: 50;
    transform: translate(-50%, -60%) rotate(-20deg); display: none;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
  }

  .result { margin-top: 18px; min-height: 28px; font-size: 19px; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.4); text-align: center; }
  .quote { margin-top: 4px; min-height: 18px; font-size: 13px; opacity: 0.85; font-style: italic; }

  .actions { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .actions button, .lotto-actions button {
    padding: 11px 24px; font-size: 15px; border: none; border-radius: 26px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3); transition: transform 0.12s, box-shadow 0.2s;
  }
  .btn-primary { background: linear-gradient(135deg,#ffe259,#ffa751); color:#4a2500; }
  .btn-ghost { background: rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.25)!important; }
  .actions button:hover:not(:disabled), .lotto-actions button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .actions button:disabled, .lotto-actions button:disabled { opacity: 0.4; cursor: not-allowed; }

  .odds-panel { margin-top: 16px; width: 100%; max-width: 560px; background: rgba(0,0,0,0.28);
    border-radius: 14px; max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .odds-panel.open { max-height: 1400px; }
  .odds-inner { padding: 18px; }
  .odds-inner h3 { font-size: 15px; margin-bottom: 8px; color: var(--gold); }
  .odds-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  .odds-table th, .odds-table td { padding: 5px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .odds-table th { color: var(--gold); }
  .odds-note { font-size: 12px; opacity: 0.8; }
  .odds-secret { font-size: 12.5px; color: var(--gold); margin-top: 6px; text-align: center; opacity: 0.9; }

  .gameover { position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
  .gameover.show { display: flex; animation: fade 0.4s; }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }
  .gameover h2 { font-size: 42px; margin-bottom: 12px; }
  .gameover p { font-size: 18px; margin-bottom: 8px; }
  .gameover .sub { font-size: 14px; opacity: 0.8; margin-bottom: 24px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; display:none; }
</style>
</head>
<body>
  <h1>🎰 幸运刮刮乐 & 体彩 🍀</h1>
  <p class="tip">刮刮乐即刮即中 · 体彩选号可多注连投冲共享大奖池<br>每次投注都会为共享奖池注入资金，中头奖独得全部！</p>

  <div class="pool">
    <div class="k">💰 共享奖池 SUPER POOL</div>
    <div class="v" id="poolVal">￥0</div>
    <div class="note">全服累积 · 体彩「选3全中」独得 · 刮到隐藏大奖瓜分 30%</div>
    <div class="best" id="poolBest">🏆 奖池历史最高 ￥0</div>
  </div>

  <div class="marquee"><span id="marqueeText"></span></div>

  <div class="stats">
    <div class="stat"><div class="k">💰 余额</div><div class="v money" id="balance">￥0</div></div>
    <div class="stat"><div class="k">🎫 已玩</div><div class="v" id="plays">0</div></div>
    <div class="stat"><div class="k">🔥 连胜</div><div class="v" id="streak">0</div></div>
    <div class="stat"><div class="k">🏆 最高纪录</div><div class="v" id="best">￥0</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="scratch">🎫 刮刮乐</div>
    <div class="tab" data-view="lotto">🎱 体彩乐透</div>
  </div>

  <div class="view active" id="view-scratch">
    <div class="shop" id="shop"></div>
    <div class="card-wrap">
      <div class="card-inner">
        <div class="grid" id="grid" style="display:none;"></div>
        <div class="placeholder" id="placeholder">👆 选择上方一种刮刮乐<br>开启好运！</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" id="revealAllBtn" disabled>⚡ 一键刮开</button>
    </div>
  </div>

  <div class="view" id="view-lotto">
    <div class="lotto-box">
      <h3>🎱 幸运乐透 · 选 3</h3>
      <p class="sub">从 1~10 中选择 3 个号码，可 1/5/10 注连投。<br>命中越多奖越大，<b>任意一注全中 3 个独得整个共享奖池！</b></p>
      <div class="ball-pick" id="ballPick"></div>
      <div class="bet-count" id="betCount"><span class="lbl">注数：</span></div>
      <div class="lotto-actions">
        <button class="btn-ghost" id="quickPick">🎲 机选</button>
        <button class="btn-primary" id="drawBtn" disabled>开奖（￥10）</button>
      </div>
      <div class="draw-result" id="drawResult"></div>
    </div>
  </div>

  <div class="result" id="result"></div>
  <div class="quote" id="quote"></div>

  <div class="actions">
    <button class="btn-ghost" id="oddsBtn">📊 中奖概率</button>
    <button class="btn-ghost" id="soundBtn">🔊 音效：开</button>
  </div>

  <div class="odds-panel" id="oddsPanel"><div class="odds-inner" id="oddsInner"></div></div>

  <div id="scratcher">🪙</div>
  <canvas id="confetti"></canvas>

  <div class="gameover" id="gameover">
    <h2>💸 游戏结束</h2>
    <p id="goText"></p>
    <p class="sub" id="goSub"></p>
    <div class="actions"><button class="btn-primary" id="restart">🔄 再来一局</button></div>
  </div>

<script>
  // ===== 配置 =====
  const START_BALANCE = 100;
  const CARD_TYPES = [
    { id:'low',  name:'铜卡', cost:5,  zones:6, cls:'low',  desc:'低风险 · 6奖区',
      zonePrizes:[ {m:0,weight:89},{m:0.4,weight:7},{m:1,weight:3},{m:4,weight:1} ] },
    { id:'mid',  name:'银卡', cost:20, zones:6, cls:'mid',  desc:'中风险 · 6奖区',
      zonePrizes:[ {m:0,weight:92},{m:0.5,weight:5},{m:2,weight:2},{m:8,weight:1} ] },
    { id:'high', name:'金卡', cost:50, zones:9, cls:'high', desc:'高风险 · 9奖区',
      zonePrizes:[ {m:0,weight:94},{m:0.5,weight:3.5},{m:3,weight:1.5},{m:15,weight:1} ] },
  ];
  const BIG_PRIZE_MULT = 5;
  const HIDDEN_JACKPOT = { chance: 0.002, mult: 100 };
  const POOL_CONTRIB = 0.2;
  const LOTTO_COST = 10, LOTTO_CONTRIB = 0.4, LOTTO_POOL_MIN = 500;
  const BET_OPTIONS = [1, 5, 10];
  const WIN_QUOTES = ['手气爆棚！','欧皇附体 ✨','今天是你的幸运日！','再来亿次！','财神爷来敲门啦 💰','稳住，我们能赢！'];
  const LOSE_QUOTES = ['差一点点…','下一张就是大奖！','别灰心，运气在路上','再试一把？','非酋不哭，欧气正在充值…'];

  // ===== 状态 =====
  let balance=START_BALANCE, plays=0, streak=0;
  let best = Number(localStorage.getItem('scratch_best')||START_BALANCE);
  let pool = Number(localStorage.getItem('scratch_pool')||2000);
  let poolBest = Number(localStorage.getItem('scratch_pool_best')||pool);
  let soundOn=true, currentCard=null, zones=[], settled=false, inGame=false, isDrawing=false;
  let picked=[], betCount=1;

  // ===== DOM =====
  const $=id=>document.getElementById(id);
  const balanceEl=$('balance'), playsEl=$('plays'), streakEl=$('streak'), bestEl=$('best');
  const poolEl=$('poolVal'), poolBestEl=$('poolBest');
  const shopEl=$('shop'), gridEl=$('grid'), placeholderEl=$('placeholder');
  const resultEl=$('result'), quoteEl=$('quote');
  const revealAllBtn=$('revealAllBtn'), oddsBtn=$('oddsBtn'), oddsPanel=$('oddsPanel'), oddsInner=$('oddsInner');
  const soundBtn=$('soundBtn'), gameoverEl=$('gameover'), goTextEl=$('goText'), goSubEl=$('goSub'), restartBtn=$('restart');
  const scratcher=$('scratcher'), confetti=$('confetti');
  const ballPick=$('ballPick'), betCountEl=$('betCount'), quickPick=$('quickPick'), drawBtn=$('drawBtn'), drawResult=$('drawResult');

  // ===== 音效 =====
  let audioCtx=null, lastScratchSound=0;
  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  function beep(freq,start,dur,type='sine',g=0.2){
    const o=audioCtx.createOscillator(), gn=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    gn.gain.setValueAtTime(0.0001,audioCtx.currentTime+start);
    gn.gain.exponentialRampToValueAtTime(g,audioCtx.currentTime+start+0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+start+dur);
    o.connect(gn).connect(audioCtx.destination);
    o.start(audioCtx.currentTime+start); o.stop(audioCtx.currentTime+start+dur);
  }
  function playScratch(){
    if(!soundOn) return; const now=performance.now();
    if(now-lastScratchSound<55) return; lastScratchSound=now; ensureAudio();
    const dur=0.09;
    const b=audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*dur), audioCtx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++){ const env=Math.pow(1-i/d.length,1.8); d[i]=(Math.random()*2-1)*env; }
    const src=audioCtx.createBufferSource(); src.buffer=b;
    const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.9;
    const gn=audioCtx.createGain(); gn.gain.value=0.4;
    src.connect(bp).connect(gn).connect(audioCtx.destination); src.start();
  }
  function playBigPrize(){ if(!soundOn)return; ensureAudio();
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,i*0.12,0.25,'triangle',0.25));
    beep(1318.51,0.5,0.5,'triangle',0.3); }
  function playJackpot(){ if(!soundOn)return; ensureAudio();
    [523.25,659.25,783.99,1046.5,1318.51,1567.98].forEach((f,i)=>beep(f,i*0.1,0.35,'triangle',0.28));
    for(let i=0;i<6;i++) beep(2093,0.65+i*0.09,0.07,'sine',0.22); }
  function playWin(){ if(!soundOn)return; ensureAudio(); beep(659.25,0,0.12,'sine',0.2); beep(880,0.12,0.15,'sine',0.2); }
  function playLose(){ if(!soundOn)return; ensureAudio(); beep(196,0,0.3,'sawtooth',0.15); }
  function playDrawTick(){ if(!soundOn)return; ensureAudio(); beep(880,0,0.06,'square',0.12); }

  // ===== 共享奖池 =====
  function savePool(){ localStorage.setItem('scratch_pool', Math.round(pool)); }
  function addToPool(amt){ pool+=amt; savePool(); renderPool(); }
  let poolShown=null;
  function renderPool(){
    const target=Math.round(pool);
    if(target>poolBest){ poolBest=target; localStorage.setItem('scratch_pool_best',poolBest); }
    poolBestEl.textContent='🏆 奖池历史最高 ￥'+poolBest;
    if(poolShown===null){ poolShown=target; poolEl.textContent='￥'+target; return; }
    const step=Math.max(1,Math.round((target-poolShown)/12));
    clearInterval(renderPool._t);
    renderPool._t=setInterval(()=>{
      if(Math.abs(target-poolShown)<=Math.abs(step)){ poolShown=target; poolEl.textContent='￥'+target; clearInterval(renderPool._t); }
      else { poolShown+=step; poolEl.textContent='￥'+poolShown; }
    },30);
  }

  // ===== 工具 =====
  function animStat(el,dir){ el.classList.remove('up','down'); void el.offsetWidth; el.classList.add(dir); }
  function updateBar(prevBal){
    balanceEl.textContent='￥'+balance; playsEl.textContent=plays; streakEl.textContent=streak;
    if(balance>best){ best=balance; localStorage.setItem('scratch_best',best); }
    bestEl.textContent='￥'+best;
    if(prevBal!==undefined && balance!==prevBal) animStat(balanceEl, balance>prevBal?'up':'down');
  }
  function afterSpend(){
    const cheapest=Math.min(...CARD_TYPES.map(c=>c.cost), LOTTO_COST);
    if(balance<cheapest) endGame();
  }
  function pickZonePrize(card){
    const total=card.zonePrizes.reduce((s,p)=>s+p.weight,0); let r=Math.random()*total;
    for(const p of card.zonePrizes){ if(r<p.weight) return p; r-=p.weight; } return card.zonePrizes[0];
  }

  // ===== 刮刮乐 =====
  function renderShop(){
    shopEl.innerHTML='';
    CARD_TYPES.forEach(card=>{
      const maxWin=card.cost*Math.max(...card.zonePrizes.map(p=>p.m))*card.zones;
      const btn=document.createElement('button');
      btn.className='card-btn '+card.cls;
      btn.innerHTML=`<div class="name">${card.name}</div><div class="cost">￥${card.cost}/张</div>
        <div class="desc">${card.desc}</div><div class="top">最高可中 ￥${maxWin}</div>`;
      btn.disabled = balance<card.cost || (inGame && !settled);
      if(currentCard && currentCard.id===card.id && inGame) btn.classList.add('active');
      btn.addEventListener('click',()=>buyCard(card));
      shopEl.appendChild(btn);
    });
  }
  function coatCanvas(ctx,w,h){
    ctx.globalCompositeOperation='source-over';
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#c0c0c0'); g.addColorStop(0.5,'#e8e8e8'); g.addColorStop(1,'#aaa');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){ ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.3})`;
      ctx.fillRect(Math.random()*w,Math.random()*h,2,2); }
    ctx.fillStyle='#888'; ctx.font='bold 12px Microsoft YaHei'; ctx.textAlign='center';
    ctx.fillText('刮开',w/2,h/2+4);
  }
  function buyCard(card){
    if(balance<card.cost) return; if(inGame && !settled) return;
    ensureAudio();
    const prev=balance;
    balance-=card.cost; plays++; currentCard=card; inGame=true; settled=false;
    addToPool(card.cost*POOL_CONTRIB);
    updateBar(prev); resultEl.textContent=''; quoteEl.textContent='';
    placeholderEl.style.display='none'; gridEl.style.display='grid';
    gridEl.innerHTML=''; zones=[];
    for(let i=0;i<card.zones;i++){
      let value, jackpot=false;
      if(Math.random()<HIDDEN_JACKPOT.chance){ value=card.cost*HIDDEN_JACKPOT.mult; jackpot=true; }
      else value=Math.round(card.cost*pickZonePrize(card).m);
      const wrap=document.createElement('div'); wrap.className='zone';
      const val=document.createElement('span'); val.className='val';
      val.textContent = jackpot ? '💎￥'+value : (value>0 ? '￥'+value : '💤');
      const cv=document.createElement('canvas'); cv.width=108; cv.height=76;
      const cx=cv.getContext('2d'); coatCanvas(cx,108,76);
      wrap.appendChild(val); wrap.appendChild(cv); gridEl.appendChild(wrap);
      const zone={canvas:cv,ctx:cx,value,jackpot,revealed:false,wrap}; zones.push(zone); attachScratch(zone);
    }
    revealAllBtn.disabled=false; renderShop();
  }
  function attachScratch(zone){
    const cv=zone.canvas;
    const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
      return {x:p.clientX-r.left, y:p.clientY-r.top}; };
    const scratch=e=>{
      if(!isDrawing||zone.revealed||settled) return;
      const {x,y}=pos(e);
      zone.ctx.globalCompositeOperation='destination-out';
      zone.ctx.beginPath(); zone.ctx.arc(x,y,15,0,Math.PI*2); zone.ctx.fill();
      playScratch();
    };
    cv.addEventListener('mousedown',e=>{e.preventDefault(); isDrawing=true; scratch(e);});
    cv.addEventListener('mousemove',scratch);
    cv.addEventListener('mouseup',()=>{isDrawing=false; checkZone(zone);});
    cv.addEventListener('touchstart',e=>{e.preventDefault(); isDrawing=true; scratch(e);},{passive:false});
    cv.addEventListener('touchmove',e=>{e.preventDefault(); scratch(e);},{passive:false});
    cv.addEventListener('touchend',()=>{isDrawing=false; checkZone(zone);});
  }
  function checkZone(zone){
    if(zone.revealed||settled) return;
    const img=zone.ctx.getImageData(0,0,zone.canvas.width,zone.canvas.height).data;
    let cleared=0; for(let i=3;i<img.length;i+=4) if(img[i]===0) cleared++;
    if(cleared/(img.length/4)>0.5) revealZone(zone);
  }
  function markRevealed(zone){
    zone.revealed=true;
    zone.canvas.style.transition='opacity 0.3s'; zone.canvas.style.opacity='0'; zone.canvas.style.pointerEvents='none';
    if(zone.jackpot) zone.wrap.classList.add('jackpot');
    else if(zone.value>0) zone.wrap.classList.add('win');
  }
  function revealZone(zone){ markRevealed(zone); if(zones.every(z=>z.revealed)) settle(); }
  function revealAll(){ if(!inGame||settled) return; zones.forEach(markRevealed); settle(); }

  function settle(){
    if(settled) return; settled=true; revealAllBtn.disabled=true;
    const prev=balance;
    let total=zones.reduce((s,z)=>s+z.value,0);
    const hasJackpot=zones.some(z=>z.jackpot);
    let poolBonus=0;
    if(hasJackpot){ poolBonus=Math.round(pool*0.3); pool-=poolBonus; savePool(); renderPool(); }
    total+=poolBonus;
    balance+=total; const net=total-currentCard.cost;
    if(hasJackpot){
      resultEl.innerHTML=`💎💎 隐藏大奖！奖金 ￥${total-poolBonus} + 瓜分奖池 <span style="color:#ffd700">￥${poolBonus}</span> = <span style="color:#ffd700">￥${total}</span>`;
      quoteEl.textContent='传说级欧气！截图纪念这一刻 📸';
      playJackpot(); launchConfetti(); launchConfetti(); streak++;
    } else if(total>=currentCard.cost*BIG_PRIZE_MULT){
      resultEl.innerHTML=`🎉🎉 大奖！累计赢得 <span style="color:#7CFC00">￥${total}</span>（净赚 ￥${net}）`;
      quoteEl.textContent=WIN_QUOTES[Math.floor(Math.random()*WIN_QUOTES.length)];
      playBigPrize(); launchConfetti(); streak++;
    } else if(total>0){
      resultEl.textContent=`🎉 中奖 ￥${total}（本张净${net>=0?'赚':'亏'} ￥${Math.abs(net)}）`;
      quoteEl.textContent = net>=0 ? WIN_QUOTES[Math.floor(Math.random()*WIN_QUOTES.length)] : LOSE_QUOTES[Math.floor(Math.random()*LOSE_QUOTES.length)];
      playWin(); if(net>=0) streak++; else streak=0;
    } else {
      resultEl.textContent=`😢 全部落空，亏了 ￥${currentCard.cost}`;
      quoteEl.textContent=LOSE_QUOTES[Math.floor(Math.random()*LOSE_QUOTES.length)];
      playLose(); streak=0;
    }
    updateBar(prev);
    setTimeout(()=>{ inGame=false; renderShop(); afterSpend(); },1000);
  }

  // ===== 体彩乐透（多注连投）=====
  const LOTTO_MAX=10, LOTTO_PICK=3;
  function renderBalls(){
    ballPick.innerHTML='';
    for(let n=1;n<=LOTTO_MAX;n++){
      const b=document.createElement('div');
      b.className='ball'+(picked.includes(n)?' sel':'');
      b.textContent=n;
      b.addEventListener('click',()=>toggleBall(n));
      ballPick.appendChild(b);
    }
    refreshDrawBtn();
  }
  function renderBetOptions(){
    betCountEl.querySelectorAll('.bc').forEach(x=>x.remove());
    BET_OPTIONS.forEach(c=>{
      const b=document.createElement('div');
      b.className='bc'+(betCount===c?' active':'');
      b.textContent=c+'注';
      b.addEventListener('click',()=>{ if(inGame&&!settled) return; betCount=c; renderBetOptions(); refreshDrawBtn(); });
      betCountEl.appendChild(b);
    });
  }
  function refreshDrawBtn(){
    const cost=LOTTO_COST*betCount;
    drawBtn.textContent=`开奖（￥${cost}）`;
    drawBtn.disabled = picked.length!==LOTTO_PICK || balance<cost;
  }
  function toggleBall(n){
    if(inGame&&!settled) return;
    const i=picked.indexOf(n);
    if(i>=0) picked.splice(i,1);
    else { if(picked.length>=LOTTO_PICK) return; picked.push(n); }
    renderBalls();
  }
  quickPick.addEventListener('click',()=>{
    if(inGame&&!settled) return;
    picked=[]; const bag=[...Array(LOTTO_MAX)].map((_,i)=>i+1);
    for(let k=0;k<LOTTO_PICK;k++) picked.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0]);
    renderBalls();
  });

  function drawLotto(){
    const cost=LOTTO_COST*betCount;
    if(picked.length!==LOTTO_PICK || balance<cost) return;
    ensureAudio();
    const prev=balance;
    balance-=cost; plays+=betCount; inGame=true; settled=false;
    addToPool(cost*LOTTO_CONTRIB);
    updateBar(prev); resultEl.textContent=''; quoteEl.textContent=''; drawResult.innerHTML='';
    drawBtn.disabled=true; quickPick.disabled=true;

    // 生成每一注的开奖号码
    const notes=[];
    for(let i=0;i<betCount;i++){
      const bag=[...Array(LOTTO_MAX)].map((_,k)=>k+1); const drawn=[];
      for(let k=0;k<LOTTO_PICK;k++) drawn.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0]);
      notes.push(drawn);
    }

    if(betCount===1){
      // 单注：逐球揭晓
      const drawn=notes[0];
      const row=document.createElement('div'); row.className='note-row'; drawResult.appendChild(row);
      let idx=0;
      const show=()=>{
        if(idx<drawn.length){
          const n=drawn[idx]; const matched=picked.includes(n);
          const el=document.createElement('div'); el.className='draw-ball'+(matched?' matched':''); el.textContent=n;
          row.appendChild(el); playDrawTick(); idx++; setTimeout(show,500);
        } else settleLotto(notes, prev);
      };
      show();
    } else {
      // 多注：逐行快速揭晓
      let i=0;
      const showRow=()=>{
        if(i<notes.length){
          const drawn=notes[i]; let hits=0;
          const row=document.createElement('div'); row.className='note-row';
          const lbl=document.createElement('span'); lbl.className='note-lbl'; lbl.textContent=`第${i+1}注`; row.appendChild(lbl);
          drawn.forEach(n=>{ const m=picked.includes(n); if(m)hits++;
            const el=document.createElement('div'); el.className='draw-ball'+(m?' matched':''); el.textContent=n; row.appendChild(el); });
          const tag=document.createElement('span'); tag.className='note-tag';
          tag.style.color = hits===3?'#ffd700':(hits===2?'#7CFC00':'#bbb');
          tag.textContent = hits===3?'🎊头奖':(hits===2?'+￥'+(LOTTO_COST*3):'未中');
          row.appendChild(tag);
          drawResult.appendChild(row); drawResult.scrollTop=drawResult.scrollHeight;
          playDrawTick(); i++; setTimeout(showRow,180);
        } else settleLotto(notes, prev);
      };
      showRow();
    }
  }

  function settleLotto(notes, prev){
    let reward=0, hit2=0, hit3=0;
    const everHit=new Set();
    notes.forEach(drawn=>{
      const hitNums=picked.filter(n=>drawn.includes(n));
      hitNums.forEach(n=>everHit.add(n));
      const hits=hitNums.length;
      if(hits===3){ hit3++; reward+=Math.round(pool); pool=LOTTO_POOL_MIN; savePool(); }
      else if(hits===2){ hit2++; reward+=LOTTO_COST*3; }
    });
    renderPool();
    balance+=reward;
    // 高亮曾命中的选号
    [...ballPick.children].forEach(b=>{ if(everHit.has(+b.textContent)) b.classList.add('hit'); });

    const cost=LOTTO_COST*betCount, net=reward-cost;
    if(hit3>0){
      resultEl.innerHTML=`🎊🎊 ${hit3}注全中！独揽奖池，共得 <span style="color:#ffd700">￥${reward}</span>（净${net>=0?'赚':'亏'} ￥${Math.abs(net)}）`;
      quoteEl.textContent='史诗级头奖！奖池已重置，快去炫耀 🏆';
      playJackpot(); launchConfetti(); launchConfetti(); streak++;
    } else if(reward>0){
      resultEl.textContent=`🎉 ${betCount}注中，${hit2}注命中2个，共得 ￥${reward}（净${net>=0?'赚':'亏'} ￥${Math.abs(net)}）`;
      quoteEl.textContent = net>=0 ? WIN_QUOTES[Math.floor(Math.random()*WIN_QUOTES.length)] : LOSE_QUOTES[Math.floor(Math.random()*LOSE_QUOTES.length)];
      playWin(); if(net>=0) streak++; else streak=0;
    } else {
      resultEl.textContent=`😢 ${betCount}注全部落空，亏了 ￥${cost}`;
      quoteEl.textContent=LOSE_QUOTES[Math.floor(Math.random()*LOSE_QUOTES.length)];
      playLose(); streak=0;
    }
    updateBar(prev);
    inGame=false; settled=true;
    quickPick.disabled=false; renderBetOptions(); refreshDrawBtn();
    afterSpend();
  }
  drawBtn.addEventListener('click',drawLotto);

  // ===== 结束/重开 =====
  function endGame(){
    inGame=false;
    goTextEl.textContent=`你一共玩了 ${plays} 次，最终余额 ￥${balance}。`;
    goSubEl.textContent = balance>=best ? `🏆 新纪录诞生！最高纪录 ￥${best}` : `距离最高纪录 ￥${best} 还差 ￥${best-balance}，再来一局！`;
    gameoverEl.classList.add('show');
  }
  function restart(){
    balance=START_BALANCE; plays=0; streak=0; inGame=false; settled=false; currentCard=null; zones=[]; picked=[]; betCount=1;
    gridEl.style.display='none'; gridEl.innerHTML=''; placeholderEl.style.display='block';
    resultEl.textContent=''; quoteEl.textContent=''; revealAllBtn.disabled=true; drawResult.innerHTML='';
    gameoverEl.classList.remove('show'); updateBar(); renderShop(); renderBalls(); renderBetOptions();
  }

  // ===== Tab 切换 =====
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      if(inGame&&!settled) return;
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('view-'+t.dataset.view).classList.add('active');
    });
  });

  // ===== 概率面板 =====
  function buildOdds(){
    let html='';
    CARD_TYPES.forEach(card=>{
      const totalW=card.zonePrizes.reduce((s,p)=>s+p.weight,0);
      const zeroP=card.zonePrizes.find(p=>p.m===0).weight/totalW;
      const allZero=Math.pow(zeroP,card.zones)*100;
      html+=`<h3>🎫 ${card.name}（￥${card.cost}，${card.zones} 奖区）</h3>`;
      html+=`<table class="odds-table"><tr><th>单区奖金</th><th>倍数</th><th>单区概率</th></tr>`;
      card.zonePrizes.forEach(p=>{ const amt=Math.round(card.cost*p.m);
        html+=`<tr><td>${amt>0?'￥'+amt:'未中'}</td><td>×${p.m}</td><td>${(p.weight/totalW*100).toFixed(1)}%</td></tr>`; });
      html+=`</table><div class="odds-note">整张全部落空概率约 ${allZero.toFixed(1)}% · 每区独立开奖，总奖金累加</div><br>`;
    });
    html+=`<h3>🎱 幸运乐透 · 选3（￥${LOTTO_COST}/注，支持 1/5/10 注连投）</h3>`;
    html+=`<table class="odds-table"><tr><th>单注命中</th><th>奖励</th><th>概率</th></tr>`;
    html+=`<tr><td>3 个（头奖）</td><td>独得共享奖池</td><td>0.83%</td></tr>`;
    html+=`<tr><td>2 个</td><td>￥${LOTTO_COST*3}</td><td>17.5%</td></tr>`;
    html+=`<tr><td>0~1 个</td><td>未中</td><td>81.7%</td></tr>`;
    html+=`</table><div class="odds-note">每注独立开奖，多注连投任意一注全中即得奖池 · 投注 ${LOTTO_CONTRIB*100}% 注入共享奖池</div>`;
    html+=`<div class="odds-secret">💎 每张刮刮乐里还藏着未公开的神秘大奖，刮中可瓜分奖池 30%……👀</div>`;
    oddsInner.innerHTML=html;
  }

  // ===== 彩带 =====
  const cctx=confetti.getContext('2d'); let confParts=[], confAnim=null, confEnd=0;
  function resizeConf(){ confetti.width=innerWidth; confetti.height=innerHeight; }
  addEventListener('resize',resizeConf); resizeConf();
  function launchConfetti(){
    confetti.style.display='block';
    const colors=['#ffd700','#ff6b6b','#4ecdc4','#7CFC00','#ff8cc6','#8a5cff'];
    for(let i=0;i<140;i++) confParts.push({
      x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.4,
      w:6+Math.random()*8, h:8+Math.random()*10,
      c:colors[Math.floor(Math.random()*colors.length)],
      vy:2+Math.random()*4, vx:-2+Math.random()*4, rot:Math.random()*6, vr:-0.2+Math.random()*0.4 });
    confEnd=performance.now()+2500;
    if(!confAnim){
      (function loop(t){
        cctx.clearRect(0,0,confetti.width,confetti.height);
        confParts.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
          cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
          cctx.fillStyle=p.c; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore(); });
        confParts=confParts.filter(p=>p.y<confetti.height+20);
        if(t<confEnd || confParts.length){ confAnim=requestAnimationFrame(loop); }
        else { confAnim=null; cctx.clearRect(0,0,confetti.width,confetti.height); confetti.style.display='none'; }
      })(performance.now());
    }
  }

  // ===== 跟随刮刀 =====
  addEventListener('mousemove',e=>{
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(inGame && !settled && el && el.tagName==='CANVAS' && el.closest('.zone')){
      scratcher.style.display='block';
      scratcher.style.left=e.clientX+'px'; scratcher.style.top=e.clientY+'px';
      scratcher.textContent = isDrawing ? '🪙' : '🖐️';
    } else scratcher.style.display='none';
  });

  // ===== 事件 =====
  revealAllBtn.addEventListener('click',revealAll);
  oddsBtn.addEventListener('click',()=>{ oddsPanel.classList.toggle('open');
    oddsBtn.textContent = oddsPanel.classList.contains('open') ? '📊 收起概率' : '📊 中奖概率'; });
  soundBtn.addEventListener('click',()=>{ soundOn=!soundOn;
    soundBtn.textContent = soundOn?'🔊 音效：开':'🔇 音效：关'; if(soundOn) ensureAudio(); });
  restartBtn.addEventListener('click',restart);
  addEventListener('mouseup',()=>{isDrawing=false;});

  $('marqueeText').textContent='🎊 恭喜「幸运星777」体彩10注连投全中独揽奖池 ￥8600！ 　💎 「欧皇001」刮中隐藏大奖！ 　🍀 共享奖池持续飙升中！ 　🔥 冲击最高纪录！';

  // 初始化
  renderPool(); updateBar(); renderShop(); renderBalls(); renderBetOptions(); buildOdds();
</script>
</body>
